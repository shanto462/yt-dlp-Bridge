name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If a download fails with an error from a site (for example `HTTP Error 403`), first update yt-dlp: menu bar → yt-dlp → Update yt-dlp. Most site errors are fixed in yt-dlp itself.

        For a security problem, do not use this form. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I clicked "Download as MP3" on a playlist and only the first item was saved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://www.youtube.com/watch?v=jNQXAC9IVRw
        2. Open the popup, choose Audio, MP3
        3. Click Download
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Menu bar → the download → Copy Log. It starts with the exact yt-dlp command. You can replace personal paths with `~`.
      render: text
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the extension settings page under Connection.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ytdlp-version
    attributes:
      label: yt-dlp version
      description: Run `yt-dlp --version`.
      placeholder: "2026.08.19"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and browser
      placeholder: macOS 15.5 (Apple Silicon), Chrome 141
    validations:
      required: true
